name: REC-0002 regenerate frontend lockfile

on:
  push:
    branches:
      - recovery/rec-0002-frontend-manifest
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/recovery-rec-0002-lockfile.yml
  pull_request:
    branches:
      - main
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/recovery-rec-0002-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.event_name != 'pull_request' || github.head_ref == 'recovery/rec-0002-frontend-manifest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/rec-0002-frontend-manifest

      - name: Setup Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reconcile lockfile from package manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate package JSON files
        working-directory: frontend
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8'))"

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "softmobile-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "REC-0002: regenerate coherent frontend lockfile"
          git push origin HEAD:recovery/rec-0002-frontend-manifest
