name: REC-0002 frontend reproducibility

on:
  push:
    branches:
      - recovery/rec-0002-frontend-manifest
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/src/**
      - .github/workflows/recovery-rec-0002-lockfile.yml
  pull_request:
    branches:
      - main
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/src/**
      - .github/workflows/recovery-rec-0002-lockfile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frontend:
    if: github.event_name != 'pull_request' || github.head_ref == 'recovery/rec-0002-frontend-manifest'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/rec-0002-frontend-manifest

      - name: Setup Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate package JSON files
        working-directory: frontend
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8'))"

      - name: Verify lockfile matches manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code -- package-lock.json

      - name: Clean install from lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Record strict TypeScript debt without blocking REC-0002
        continue-on-error: true
        working-directory: frontend
        run: npm run typecheck:strict
