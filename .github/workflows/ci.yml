name: Softmobile CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: softmobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · install, smoke, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: sqlite:///./ci_softmobile.db
      JWT_SECRET_KEY: ci-test-secret-key-only
      ACCESS_TOKEN_EXPIRE_MINUTES: '60'
      REFRESH_TOKEN_EXPIRE_DAYS: '7'
      CORS_ORIGINS: '["http://testserver","http://localhost:5173"]'
      SOFTMOBILE_BOOTSTRAP_TOKEN: ci-bootstrap-token
      SOFTMOBILE_ENABLE_SCHEDULER: '0'
      SOFTMOBILE_ENABLE_BACKUP_SCHEDULER: '0'
      SOFTMOBILE_ENABLE_CATALOG_PRO: '1'
      SOFTMOBILE_ENABLE_TRANSFERS: '1'
      SOFTMOBILE_ENABLE_PURCHASES_SALES: '1'
      SOFTMOBILE_ENABLE_ANALYTICS_ADV: '1'
      SOFTMOBILE_ENABLE_2FA: '0'
      SOFTMOBILE_ENABLE_HYBRID_PREP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Import FastAPI application
        run: |
          python - <<'PY'
          from backend.app.main import app
          print(f'app_title={app.title}')
          print(f'app_version={app.version}')
          print(f'routes_mounted={len(app.routes)}')
          PY

      - name: Collect backend tests
        run: pytest --collect-only -q backend/tests

      - name: Authentication and HTTP smoke tests
        run: pytest -q backend/tests/test_http_simple_app.py backend/tests/test_routes_bootstrap.py backend/tests/test_auth_pack28.py

      - name: Full backend suite
        run: pytest -q backend/tests

  frontend:
    name: Frontend · install, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify package files are valid JSON
        working-directory: frontend
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8'))"

      - name: Verify lockfile matches manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code -- package-lock.json

      - name: Clean install
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build

  frontend-strict-types:
    name: Frontend · strict TypeScript debt (#764)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Strict TypeScript check
        working-directory: frontend
        run: npm run typecheck:strict
