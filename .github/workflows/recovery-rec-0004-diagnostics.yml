name: REC-0004 backend diagnostics

on:
  push:
    branches:
      - recovery/rec-0004-legacy-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-failures:
    name: REC-0004 · concise backend failures
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: sqlite:///./ci_softmobile.db
      JWT_SECRET_KEY: ci-test-secret-key-only
      ACCESS_TOKEN_EXPIRE_MINUTES: '60'
      REFRESH_TOKEN_EXPIRE_DAYS: '7'
      CORS_ORIGINS: '["http://testserver","http://localhost:5173"]'
      SOFTMOBILE_BOOTSTRAP_TOKEN: ci-bootstrap-token
      SOFTMOBILE_ENABLE_SCHEDULER: '0'
      SOFTMOBILE_ENABLE_BACKUP_SCHEDULER: '0'
      SOFTMOBILE_ENABLE_CATALOG_PRO: '1'
      SOFTMOBILE_ENABLE_TRANSFERS: '1'
      SOFTMOBILE_ENABLE_PURCHASES_SALES: '1'
      SOFTMOBILE_ENABLE_ANALYTICS_ADV: '1'
      SOFTMOBILE_ENABLE_2FA: '0'
      SOFTMOBILE_ENABLE_HYBRID_PREP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Run suite and print concise failure summary
        shell: bash
        run: |
          set +e
          pytest -q backend/tests --tb=short --maxfail=10 > /tmp/rec0004-pytest.log 2>&1
          rc=$?
          echo '=== REC-0004 FAILED/ERROR TESTS ==='
          grep -E '^(FAILED|ERROR) ' /tmp/rec0004-pytest.log || true
          echo '=== REC-0004 PYTEST SUMMARY ==='
          tail -n 35 /tmp/rec0004-pytest.log
          exit "$rc"

      - name: Preserve full pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rec0004-pytest-log
          path: /tmp/rec0004-pytest.log
          if-no-files-found: warn
          retention-days: 7
